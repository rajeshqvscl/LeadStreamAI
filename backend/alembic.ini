# Alembic configuration for LeadStreamAI

[alembic]
# path to migration scripts
script_location = %(here)s/migrations

# template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
prepend_sys_path = .

# timezone for migration file timestamps
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 50

# version location specification
version_locations = %(here)s/migrations/versions

# path_separator
path_separator = os

# search source files recursively
recursive_version_locations = true

# the output encoding used when revision files are written
output_encoding = utf-8

# database URL - will be overridden by env.py from environment
sqlalchemy.url = postgresql://user:pass@localhost/dbname


[post_write_hooks]
# format using ruff
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S