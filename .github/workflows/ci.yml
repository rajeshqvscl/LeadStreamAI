name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leadstreamai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Verify API contract (route collisions + missing routes)
        run: python scripts/verify_api_contract.py --frontend ../frontend/src
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leadstreamai

      - name: Runtime smoke test (no 404/405 regressions)
        run: python scripts/smoke_test.py

      - name: Integration tests
        run: python -m pytest tests/integration -q

      - name: E2E wiring test (real Postgres + Redis)
        run: python scripts/e2e_real_wiring.py
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leadstreamai
          E2E_REDIS_URL: redis://localhost:6379/0
